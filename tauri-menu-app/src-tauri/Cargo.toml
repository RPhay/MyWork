[package]
name = "menu-app"
version = "0.1.0"
description = "MyWork macOS menu bar app"
authors = ["MyWork"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["window-all", "http-client"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24"
objc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
strip = true
lto = true
