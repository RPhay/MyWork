[package]
name = "mywork-monitors"
version = "0.1.0"
description = "Frameless always-on-top windows for the MyWork focus monitors"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
serde_json = "1"
